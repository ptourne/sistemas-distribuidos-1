name: analisis-peliculas
services:
    rabbitmq:
        container_name: rabbitmq
        image: rabbitmq:management 
        ports:
            - "5672:5672"
            - "15672:15672"
        networks:
            - local_net
        healthcheck:
            test: rabbitmq-diagnostics -q ping
            interval: 10s
            timeout: 10s
            retries: 10
        volumes:
            - /Users/melinajauregui/Documents/distro-tps/tp-grupal/rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/rabbitmq.conf

    sentiment_server:
        container_name: sentiment_server
        build:
            context: .
            dockerfile: worker/nlp/python_server/Dockerfile
        ports:
            - "50051:50051"
        networks:
            - local_net
        environment:
            - GRPC_PORT=50051
            - GRPC_WORKERS=30
        healthcheck:
            test: ncat -zv localhost 50051
            interval: 10s
            timeout: 10s
            retries: 10

    coordinator:
        container_name: coordinator
        build:
            context: .
            dockerfile: coordinator/Dockerfile
        entrypoint: /coordinator
        networks:
            - local_net
        environment:
            - NUMBER_OF_WORKERS=10
            - NUMBER_OF_REDUCE_BY_COUNTRY_SUM_BUDGETS=3
            - NUMBER_OF_REDUCE_TOP_5_BY_BUDGETS=3
        depends_on:
            rabbitmq:
                condition: service_healthy
            sentiment_server:
                condition: service_healthy

    worker1:
        container_name: worker1
        build:
            context: .
            dockerfile: worker/Dockerfile
        entrypoint: /worker
        environment:
            - WORKER_ID=1
            - N_JOINERS=10
            - NLP_GRPC_ADDR=sentiment_server:50051
            - SERVER_PORT=1234
        networks:
            - local_net
        depends_on:
            rabbitmq:
                condition: service_healthy
            sentiment_server:
                condition: service_healthy
        volumes:
            - /Users/melinajauregui/Documents/distro-tps/tp-grupal/joiner_credits:/joiner_credits
            - /Users/melinajauregui/Documents/distro-tps/tp-grupal/joiner_ratings:/joiner_ratings

