name: analisis-peliculas
services:
    rabbitmq:
        container_name: rabbitmq
        image: rabbitmq:4.1.0-management
        ports:
            - "5672:5672"
            - "15672:15672"
        networks:
            - local_net
        healthcheck:
            test: rabbitmq-diagnostics -q ping
            interval: 10s
            timeout: 10s
            retries: 10
        volumes:
            - /Users/melinajauregui/Documents/distro-tps/tp-grupal/rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/rabbitmq.conf

    sentiment_server:
        container_name: sentiment_server
        build:
            context: .
            dockerfile: nlp/python_server/Dockerfile
        ports:
            - "50051:50051"
        networks:
            - local_net
        environment:
            - GRPC_PORT=50051
            - GRPC_WORKERS=30
        healthcheck:
            test: ncat -zv localhost 50051
            interval: 10s
            timeout: 10s
            retries: 10

    coordinator:
        container_name: coordinator
        build:
            context: .
            dockerfile: coordinator/Dockerfile
        entrypoint: /coordinator
        networks:
            - local_net
        environment:
            - N_WORKERS=2
            - N_RATINGS_CONSUMERS=10
            - PREFETCH=1 # Potential optimization
        depends_on:
            rabbitmq:
                condition: service_healthy
            sentiment_server:
                condition: service_healthy

    worker0:
        container_name: worker0
        build:
            context: .
            dockerfile: worker/Dockerfile
        entrypoint: /worker
        environment: 
            - WORKER_ID=0
            - N_WORKERS=2
            - N_REDUCERS_BY_COUNTRY_SUM_BUDGETS=2
            - SERVER_PORT=1234
            - PREFETCH=1 # Potential optimization
        networks:
            - local_net
        depends_on:
            rabbitmq:
                condition: service_healthy
            sentiment_server:
                condition: service_healthy

    worker1:
        container_name: worker1
        build:
            context: .
            dockerfile: worker/Dockerfile
        entrypoint: /worker
        environment: 
            - WORKER_ID=1
            - N_WORKERS=2
            - N_REDUCERS_BY_COUNTRY_SUM_BUDGETS=2
            - SERVER_PORT=1234
            - PREFETCH=1 # Potential optimization
        networks:
            - local_net
        depends_on:
            rabbitmq:
                condition: service_healthy
            sentiment_server:
                condition: service_healthy

    client0:
        container_name: client0
        build:
            context: .
            dockerfile: client/Dockerfile
        entrypoint: /client
        environment:
            - SERVER_PORT=endpoint:9876
        networks:
            - local_net
        depends_on:
            - endpoint
        volumes:
            - /Users/melinajauregui/Documents/distro-tps/tp-grupal/client/datasets:/datasets

    client1:
        container_name: client1
        build:
            context: .
            dockerfile: client/Dockerfile
        entrypoint: /client
        environment:
            - SERVER_PORT=endpoint:9876
        networks:
            - local_net
        depends_on:
            - endpoint
        volumes:
            - /Users/melinajauregui/Documents/distro-tps/tp-grupal/client/datasets:/datasets

    endpoint:
        container_name: endpoint
        build:
            context: .
            dockerfile: endpoint/Dockerfile
        entrypoint: /endpoint
        environment:
            - ENDPOINT_PORT=9876
        networks:
            - local_net
        depends_on:
            rabbitmq:
                condition: service_healthy

networks:
    local_net:
        name: local_net
        ipam:
            driver: default
            config:
                - subnet: 172.25.125.0/24

