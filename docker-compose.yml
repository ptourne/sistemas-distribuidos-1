            context: .
            dockerfile: coordinator/Dockerfile
        entrypoint: /coordinator
        networks:
            - local_net
        environment:
            - N_WORKERS=3
            - N_RATINGS_CONSUMERS=10
            - PREFETCH=1 # Potential optimization
            - NAME=coordinator
            - MONITOR_ADDRESSES=monitor0:9000
        volumes:
            - /Users/melinajauregui/Documents/distro-tps/tp-grupal/coordinator:/coordinator-dir
        depends_on:
            rabbitmq:
                condition: service_healthy

    worker0:
