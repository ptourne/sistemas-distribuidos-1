name: analisis-peliculas
services:
    rabbitmq:
        container_name: rabbitmq
        image: rabbitmq:4.1.0-management
        ports:
            - "5672:5672"
            - "15672:15672"
        networks:
            - local_net
        healthcheck:
            test: rabbitmq-diagnostics -q ping
            interval: 10s
            timeout: 10s
            retries: 10
        volumes:
            - /home/sofiagb/Documents/sd1/movies/rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/rabbitmq.conf

    sentiment_server1:
        container_name: sentiment_server1
        build:
            context: .
            dockerfile: nlp/python_server/Dockerfile
        networks:
            - local_net
        environment:
            - GRPC_PORT=50051
            - GRPC_WORKERS=30
            - NAME=sentiment_server1
            - MONITOR_ADDRESSES=monitor1:9001,monitor2:9002,monitor3:9003
        healthcheck:
            test: ['CMD', 'sh', '-c', 'nc -z localhost 50051']
            interval: 10s
            timeout: 10s
            retries: 10

    sentiment_server2:
        container_name: sentiment_server2
        build:
            context: .
            dockerfile: nlp/python_server/Dockerfile
        networks:
            - local_net
        environment:
            - GRPC_PORT=50052
            - GRPC_WORKERS=30
            - NAME=sentiment_server2
            - MONITOR_ADDRESSES=monitor1:9001,monitor2:9002,monitor3:9003
        healthcheck:
            test: ['CMD', 'sh', '-c', 'nc -z localhost 50052']
            interval: 10s
            timeout: 10s
            retries: 10

    coordinator:
        container_name: coordinator
        build:
            context: .
            dockerfile: coordinator/Dockerfile
        entrypoint: /coordinator
        networks:
            - local_net
        environment:
            - NUMBER_OF_WORKERS=4
            - NUMBER_OF_REDUCE_BY_COUNTRY_SUM_BUDGETS=2
            - NUMBER_OF_REDUCE_TOP_5_BY_BUDGETS=2
            - PREFETCH=1 # Potential optimization
            - NAME=coordinator
            - MONITOR_ADDRESSES=monitor1:9001,monitor2:9002,monitor3:9003
        depends_on:
            rabbitmq:
                condition: service_healthy

    worker1:
        container_name: worker1
        build:
            context: .
            dockerfile: worker/Dockerfile
        entrypoint: /worker
        environment: 
            - WORKER_ID=1
            - N_JOINERS_CREDITS=2
            - N_JOINERS_RATINGS=2
            - N_WORKERS=4
            - SERVER_PORT=1234
            - PREFETCH=1 # Potential optimization
            - NAME=worker1
            - MONITOR_ADDRESSES=monitor1:9001,monitor2:9002,monitor3:9003
        networks:
            - local_net
        depends_on:
            rabbitmq:
                condition: service_healthy

    worker2:
