name: analisis-peliculas
services:
    rabbitmq:
        container_name: rabbitmq
        image: rabbitmq:4.1.0-management
        ports:
            - "5672:5672"
            - "15672:15672"
        networks:
            - local_net
        healthcheck:
            test: rabbitmq-diagnostics -q ping
            interval: 10s
            timeout: 10s
            retries: 10
        volumes:
            - /Users/melinajauregui/Documents/distro-tps/tp-grupal/rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/rabbitmq.conf

    sentiment_server0:
        container_name: sentiment_server0
        build:
            context: .
            dockerfile: nlp/python_server/Dockerfile
        networks:
            - local_net
        environment:
            - GRPC_PORT=50050
            - GRPC_WORKERS=30
            - NAME=sentiment_server0
            - MONITOR_ADDRESSES=monitor0:9000,monitor1:9001,monitor2:9002
        healthcheck:
            test: ['CMD', 'sh', '-c', 'nc -z localhost 50050']
            interval: 10s
            timeout: 10s
            retries: 10

    sentiment_server1:
        container_name: sentiment_server1
