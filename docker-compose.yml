name: analisis-peliculas
services:
    rabbitmq:
        container_name: rabbitmq
        image: rabbitmq:4.0.8-management
        ports:
            - "5672:5672"
            - "15672:15672"
        networks:
            - local_net
        healthcheck:
            test: rabbitmq-diagnostics -q ping
            interval: 10s
            timeout: 10s
            retries: 10

    coordinator:
        container_name: coordinator
        build:
            context: .
            dockerfile: coordinator/Dockerfile
        entrypoint: /coordinator
        networks:
            - local_net
        environment:
            - NUMBER_OF_FILTERS=10
            - NUMBER_OF_REDUCE_BY_COUNTRY_SUM_BUDGETS=1
            - NUMBER_OF_REDUCE_TOP_5_BY_BUDGETS=1
        depends_on:
            rabbitmq:
                condition: service_healthy
        volumes:
            - /Users/melinajauregui/Documents/distro-tps/tp-grupal/datasets:/datasets

    filter1:
        container_name: filter1
        build:
            context: .
            dockerfile: worker/Dockerfile
        entrypoint: /worker
        environment:
            - WORKER_ID=1
        networks:
            - local_net
        depends_on:
            rabbitmq:
                condition: service_healthy

    filter2:
        container_name: filter2
        build:
            context: .
            dockerfile: worker/Dockerfile
        entrypoint: /worker
