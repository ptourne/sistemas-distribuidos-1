name: analisis-peliculas
services:
    rabbitmq:
        container_name: rabbitmq
        image: rabbitmq:management
        ports:
            - "5672:5672"
            - "15672:15672"
        networks:
            - local_net
        healthcheck:
            test: rabbitmq-diagnostics -q ping
            interval: 10s
            timeout: 10s
            retries: 10
        volumes:
            - /Users/melinajauregui/Documents/distro-tps/tp-grupal/rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/rabbitmq.conf

    coordinator:
        container_name: coordinator
        build:
            context: .
            dockerfile: coordinator/Dockerfile
        entrypoint: /coordinator
        networks:
            - local_net
        environment:
            - NUMBER_OF_WORKERS=2
            - NUMBER_OF_REDUCE_BY_COUNTRY_SUM_BUDGETS=1
            - NUMBER_OF_REDUCE_TOP_5_BY_BUDGETS=1
            - PREFETCH=1
        depends_on:
            rabbitmq:
                condition: service_healthy

    worker1:
        container_name: worker1
        build:
            context: .
            dockerfile: worker/Dockerfile
        entrypoint: /worker
        environment:
            - WORKER_ID=1
            - N_JOINERS=2
            - N_WORKERS=2
            - NLP_GRPC_ADDR=sentiment_server:50051
            - SERVER_PORT=1234
            - PREFETCH=1
        networks:
            - local_net
        depends_on:
            rabbitmq:
                condition: service_healthy
        volumes:
            - /Users/melinajauregui/Documents/distro-tps/tp-grupal/joiner_credits:/joiner_credits
            - /Users/melinajauregui/Documents/distro-tps/tp-grupal/joiner_ratings:/joiner_ratings

    worker2:
        container_name: worker2
        build:
            context: .
            dockerfile: worker/Dockerfile
        entrypoint: /worker
        environment:
            - WORKER_ID=2
            - N_JOINERS=2
            - N_WORKERS=2
            - NLP_GRPC_ADDR=sentiment_server:50051
            - SERVER_PORT=1234
            - PREFETCH=1
        networks:
            - local_net
        depends_on:
            rabbitmq:
                condition: service_healthy
        volumes:
            - /Users/melinajauregui/Documents/distro-tps/tp-grupal/joiner_credits:/joiner_credits
            - /Users/melinajauregui/Documents/distro-tps/tp-grupal/joiner_ratings:/joiner_ratings

    client1:
        container_name: client1
        build:
            context: .
            dockerfile: client/Dockerfile
        entrypoint: /client
        environment:
            - SERVER_PORT=endpoint:9876
        networks:
            - local_net
        depends_on:
            - endpoint
        volumes:
            - /Users/melinajauregui/Documents/distro-tps/tp-grupal/client/datasets:/datasets

    client2:
        container_name: client2
        build:
            context: .
            dockerfile: client/Dockerfile
        entrypoint: /client
        environment:
            - SERVER_PORT=endpoint:9876
        networks:
            - local_net
        depends_on:
            - endpoint
        volumes:
            - /Users/melinajauregui/Documents/distro-tps/tp-grupal/client/datasets:/datasets

    endpoint:
        container_name: endpoint
        build:
            context: .
            dockerfile: endpoint/Dockerfile
        entrypoint: /endpoint
        environment:
            - ENDPOINT_PORT=9876
        networks:
            - local_net
        depends_on:
            rabbitmq:
                condition: service_healthy

networks:
    local_net:
        name: local_net
        ipam:
            driver: default
            config:
                - subnet: 172.25.125.0/24

