name: analisis-peliculas
services:
    rabbitmq:
        container_name: rabbitmq
        image: rabbitmq:4.1.0-management
        ports:
            - "5672:5672"
            - "15672:15672"
        networks:
            - local_net
        healthcheck:
            test: rabbitmq-diagnostics -q ping
            interval: 10s
            timeout: 10s
            retries: 10
        volumes:
            - /home/sofiagb/Documents/sd1/movies/rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/rabbitmq.conf

    sentiment_server:
        container_name: sentiment_server
        build:
            context: .
            dockerfile: worker/nlp/python_server/Dockerfile
        ports:
            - "50051:50051"
        networks:
            - local_net
        environment:
            - GRPC_PORT=50051
            - GRPC_WORKERS=30
        healthcheck:
            test: ncat -zv localhost 50051
            interval: 10s
            timeout: 10s
            retries: 10

    coordinator:
        container_name: coordinator
        build:
            context: .
            dockerfile: coordinator/Dockerfile
        entrypoint: /coordinator
        networks:
            - local_net
        environment:
            - NUMBER_OF_WORKERS=1
            - NUMBER_OF_REDUCE_BY_COUNTRY_SUM_BUDGETS=0
            - NUMBER_OF_REDUCE_TOP_5_BY_BUDGETS=0
            - PREFETCH=1
        depends_on:
            rabbitmq:
                condition: service_healthy
            sentiment_server:
                condition: service_healthy

    worker1:
        container_name: worker1
        build:
            context: .
            dockerfile: worker/Dockerfile
        entrypoint: /worker
        environment: 
            - WORKER_ID=1
            - N_JOINERS_CREDITS=1
            - N_JOINERS_RATINGS=1
            - N_WORKERS=1
            - NLP_GRPC_ADDR=sentiment_server:50051
            - SERVER_PORT=1234
            - PREFETCH=1
        networks:
            - local_net
        depends_on:
            rabbitmq:
                condition: service_healthy
            sentiment_server:
                condition: service_healthy

    joiner_credits1:
        container_name: joiner_credits1
        build:
            context: .
            dockerfile: joiners/joiner_credits_worker/Dockerfile
        entrypoint: /joiners
        environment:
            - WORKER_ID=1
            - SERVER_PORT=1234
            - WORKER_COUNT=1
            - PREFETCH=1
        networks:
            - local_net
        depends_on:
            rabbitmq:
                condition: service_healthy
            sentiment_server:
                condition: service_healthy

    joiner_rating1:
        container_name: joiner_rating1
        build:
            context: .
            dockerfile: joiners/joiner_ratings_worker/Dockerfile
        entrypoint: /joiners
        environment:
            - WORKER_ID=1
            - SERVER_PORT=1234
            - WORKER_COUNT=
            - PREFETCH=1
        networks:
            - local_net
        depends_on:
            rabbitmq:
                condition: service_healthy
            sentiment_server:
                condition: service_healthy

    client1:
        container_name: client1
        build:
            context: .
            dockerfile: client/Dockerfile
        entrypoint: /client
        environment:
            - SERVER_PORT=endpoint:9876
        networks:
            - local_net
        depends_on:
            - endpoint
        volumes:
            - /home/sofiagb/Documents/sd1/movies/client/datasets:/datasets

    endpoint:
        container_name: endpoint
        build:
            context: .
            dockerfile: endpoint/Dockerfile
        entrypoint: /endpoint
        environment:
            - ENDPOINT_PORT=9876
        networks:
            - local_net
        depends_on:
            rabbitmq:
                condition: service_healthy

networks:
    local_net:
        name: local_net
        ipam:
            driver: default
            config:
                - subnet: 172.25.125.0/24

