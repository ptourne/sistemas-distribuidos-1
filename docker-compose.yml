name: analisis-peliculas
services:
    rabbitmq:
        container_name: rabbitmq
        image: rabbitmq:latest
        ports:
            - "5672:5672"
            - "15672:15672"
        networks:
            - local_net
        healthcheck:
            test: rabbitmq-diagnostics -q ping
            interval: 10s
            timeout: 10s
            retries: 10

    sentiment_server:
        container_name: sentiment_server
        build:
            context: .
            dockerfile: worker/nlp/python_server/Dockerfile
        ports:
            - "50051:50051"
        networks:
            - local_net
        depends_on:
            rabbitmq:
                condition: service_healthy
        healthcheck:
            test: ncat -zv localhost 50051
            interval: 10s
            timeout: 10s
            retries: 10

    coordinator:
        container_name: coordinator
        build:
            context: .
            dockerfile: coordinator/Dockerfile
        command: /bin/sh -c '(test -f /datasets/credits.csv || unzip /datasets/credits.zip -d /datasets) && (test -f /datasets/ratings.csv || unzip /datasets/ratings.zip -d /datasets) && /coordinator'        
        networks:
            - local_net
        environment:
            - NUMBER_OF_WORKERS=1
        depends_on:
            rabbitmq:
                condition: service_healthy
            sentiment_server:
                condition: service_healthy
        volumes:
            - /home/sofiagb/Documents/sd1/tp-movies/datasets:/datasets

    worker1:
        container_name: worker1
        build:
            context: .
            dockerfile: worker/Dockerfile
        entrypoint: /worker
        environment:
            - WORKER_ID=1
            - N_JOINERS=1
            - NLP_GRPC_ADDR=sentiment_server:50051
        networks:
            - local_net
        depends_on:
            rabbitmq:
                condition: service_healthy
            sentiment_server:
                condition: service_healthy
        volumes:
            - /home/sofiagb/Documents/sd1/tp-movies/joiner_credits:/joiner_credits
            - /home/sofiagb/Documents/sd1/tp-movies/joiner_ratings:/joiner_ratings

networks:
    local_net:
        name: local_net
        ipam:
            driver: default
            config:
                - subnet: 172.25.125.0/24

