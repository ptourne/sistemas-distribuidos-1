                condition: service_healthy
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
    
    endpoint:
        container_name: endpoint
        build:
            context: .
            dockerfile: endpoint/Dockerfile
        entrypoint: /endpoint
        environment:
            - ENDPOINT_PORT=9876
            - NAME=endpoint
            - MONITOR_ADDRESSES=monitor0:9000
        networks:
            - local_net
        depends_on:
            rabbitmq:
                condition: service_healthy

networks:
    local_net:
        name: local_net
        ipam:
            driver: default
            config:
                - subnet: 172.25.125.0/24

