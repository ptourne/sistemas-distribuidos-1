name: analisis-peliculas
services:
    rabbitmq:
        container_name: rabbitmq
        image: rabbitmq:4.0.8-management
        ports:
            - "5672:5672"
            - "15672:15672"
        networks:
            - local_net
        healthcheck:
            test: rabbitmq-diagnostics -q ping
            interval: 10s
            timeout: 10s
            retries: 10

    coordinator:
        container_name: coordinator
        build:
            context: .
            dockerfile: coordinator/Dockerfile
        entrypoint: /coordinator
        networks:
            - local_net
        environment:
            - NUMBER_OF_WORKERS=
        depends_on:
            rabbitmq:
                condition: service_healthy
        volumes:
            - /home/patriciotournepassarino/Documents/uba/distribuidos/tp-repo/datasets:/datasets

    filter1:
        container_name: filter1
        build:
            context: .
            dockerfile: worker/Dockerfile
        entrypoint: /worker
        environment:
            - WORKER_ID=1
        networks:
            - local_net
        depends_on:
            rabbitmq:
                condition: service_healthy

    reduce_by_country_sum_budget1:
        container_name: reduce_by_country_sum_budget1
        build:
            context: .
            dockerfile: map_reducer/main/reduce_by_country_sum_budget/Dockerfile
        entrypoint: /map_reducer
        environment:
            - WORKER_ID=1
        networks:
            - local_net
        depends_on:
            rabbitmq:
                condition: service_healthy

    reduce_top_5_by_budget1:
        container_name: reduce_top_5_by_budget1
        build:
            context: .
            dockerfile: map_reducer/main/reduce_top_5_by_budget/Dockerfile
        entrypoint: /map_reducer
        environment:
            - WORKER_ID=1
        networks:
            - local_net
        depends_on:
            rabbitmq:
                condition: service_healthy

networks:
    local_net:
        name: local_net
        ipam:
            driver: default
            config:
                - subnet: 172.25.125.0/24

