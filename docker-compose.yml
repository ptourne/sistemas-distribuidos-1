name: analisis-peliculas
services:
    rabbitmq:
        container_name: rabbitmq
        image: rabbitmq:4.1.0-management
        ports:
            - "5672:5672"
            - "15672:15672"
            - "15692:15692"
        networks:
            - local_net
        healthcheck:
            test: rabbitmq-diagnostics -q ping
            interval: 10s
            timeout: 10s
            retries: 10
        environment:
            - RABBITMQ_LOAD_DEFINITIONS=true
            - RABBITMQ_DEFINITIONS_FILE=/etc/rabbitmq/definitions.json
        volumes:
            - /home/patriciotournepassarino/Documents/uba/distribuidos/tp-repo/rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/rabbitmq.conf
            - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json

    sentiment_server:
        container_name: sentiment_server
        build:
            context: .
            dockerfile: nlp/python_server/Dockerfile
        ports:
            - "50051:50051"
        networks:
            - local_net
        environment:
            - GRPC_PORT=50051
            - GRPC_WORKERS=30
            - DD_SERVICE=sentiment_server
            - DD_DATA_STREAMS_ENABLED=true
            - DD_AGENT_HOST=datadog
            - DD_ENV=dev
        healthcheck:
            test: ncat -zv localhost 50051
            interval: 10s
            timeout: 10s
            retries: 10

    coordinator:
        container_name: coordinator
        build:
            context: .
            dockerfile: coordinator/Dockerfile
        entrypoint: /coordinator
        networks:
            - local_net
        environment:
            - NUMBER_OF_WORKERS=3
            - NUMBER_OF_REDUCE_BY_COUNTRY_SUM_BUDGETS=1
            - NUMBER_OF_REDUCE_TOP_5_BY_BUDGETS=1
            - PREFETCH=1 # Potential optimization
            - DD_SERVICE=coordinator
            - DD_DATA_STREAMS_ENABLED=true
            - DD_AGENT_HOST=datadog
            - DD_ENV=dev
        depends_on:
            rabbitmq:
                condition: service_healthy
            sentiment_server:
                condition: service_healthy

    worker1:
        container_name: worker1
        build:
            context: .
            dockerfile: worker/Dockerfile
        entrypoint: /worker
        environment:
            - WORKER_ID=1
            - N_JOINERS_CREDITS=1
            - N_JOINERS_RATINGS=1
            - N_WORKERS=3
            - SERVER_PORT=1234
            - PREFETCH=1 # Potential optimization
            - DD_SERVICE=worker1
            - DD_DATA_STREAMS_ENABLED=true
            - DD_AGENT_HOST=datadog
            - DD_ENV=dev
        networks:
            - local_net
        depends_on:
            rabbitmq:
                condition: service_healthy
            sentiment_server:
                condition: service_healthy

