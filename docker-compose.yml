name: analisis-peliculas
services:
    rabbitmq:
        container_name: rabbitmq
        image: rabbitmq:4.1.0-management
        ports:
            - "5672:5672"
            - "15672:15672"
        networks:
            - local_net
        healthcheck:
            test: rabbitmq-diagnostics -q ping
            interval: 10s
            timeout: 10s
            retries: 10
        volumes:
            - /home/sofiagb/Documents/sd1/movies/rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/rabbitmq.conf

    coordinator:
        container_name: coordinator
        build:
            context: .
            dockerfile: coordinator/Dockerfile
        entrypoint: /coordinator
        networks:
            - local_net
        environment:
            - N_WORKERS=3
            - N_RATINGS_CONSUMERS=10
            - PREFETCH=1 # Potential optimization
            - NAME=coordinator
            - MONITOR_ADDRESSES=monitor0:9000
        depends_on:
            rabbitmq:
                condition: service_healthy

    worker0:
        container_name: worker0
        build:
            context: .
            dockerfile: worker/Dockerfile
        entrypoint: /worker
        environment: 
            - WORKER_ID=0
            - N_WORKERS=3
            - N_REDUCERS_BY_COUNTRY_SUM_BUDGETS=3
            - SERVER_PORT=1234
            - PREFETCH=1 # Potential optimization
            - NAME=worker0
            - MONITOR_ADDRESSES=monitor0:9000
